# GitHub release: tarball, RPM, DEB and SHA256SUMS, built by the same `make release-assets`
# as the local flow. Runs only on a v* tag, or by hand (workflow_dispatch) as a dry run that
# builds and uploads workflow artifacts but never creates a release. GitHub only: Forgejo
# uses .forgejo/workflows (this directory is ignored there) and the jobs are guarded anyway.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - name: tag must look like vX.Y.Z
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag $GITHUB_REF_NAME" >&2; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby rpm cpio file
          sudo gem install fpm --version 1.16.0 --no-document
      - name: vet and test
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: build tarball, RPM, DEB and SHA256SUMS
        run: make release-assets
      # Optional, needs `id-token: write` and `attestations: write` on this job:
      # - uses: actions/attest-build-provenance@v2
      #   with:
      #     subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: mattx_exporter-dist
          path: dist/*
          if-no-files-found: error

  release:
    if: github.server_url == 'https://github.com' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mattx_exporter-dist
          path: dist
      - name: create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
